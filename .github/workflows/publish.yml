name: publish
# NuGet publishes only from this workflow (Trusted Publishing: the policy names bentrixhq/bentrix-dotnet and this
# file), on a version's tag; nuget.org hands it a short-lived key through GitHub's OIDC token, and no key is stored.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet pack mcp/Bentrix.Mcp.csproj -c Release -o out
      - run: dotnet pack src/Bentrix/Bentrix.csproj -c Release -o out
      - name: NuGet login (OIDC to a short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: bentrix
      - run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
